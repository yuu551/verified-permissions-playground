name: Test and publish playground
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run synth
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.6
      - name: Build comparison example for its existing demo URL
        working-directory: examples/policy-playground
        run: |
          npm ci
          npm test
          npm run test:ui
          npm run synth
          npm run web:synth
          npm run build:pages
          npm run test:pages
      - run: mkdir -p build/pages/examples/policy-playground && cp -R examples/policy-playground/build/pages/. build/pages/examples/policy-playground/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/pages
  pages:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy demo
        id: deploy
        uses: actions/deploy-pages@v4
